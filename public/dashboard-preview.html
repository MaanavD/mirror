<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hermy · Mirror preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#111513;color:#e8edeb;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{min-height:72px;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #303a35}h1{font-size:15px;font-weight:500;margin:0}h1 span{font-size:12px;color:#98a69f;display:block;margin-top:5px}.controls{display:flex;gap:14px;align-items:center}label{font-size:12px;color:#a7b4ad}select,a{color:#e8edeb;background:#111513;font:13px inherit;border:1px solid #45534b;padding:9px;border-radius:3px}a{text-decoration:none}select:focus-visible,a:focus-visible{outline:2px solid #9ce1db;outline-offset:3px}.stage{height:calc(100dvh - 110px);display:grid;place-items:center;overflow:hidden}.frame{width:1080px;height:1920px;transform-origin:center;border:1px solid #303a35;box-sizing:content-box;background:#000;position:relative}iframe{border:0;width:1080px;height:1920px;display:block}.corridor{position:absolute;left:340px;top:280px;width:400px;height:1320px;border:2px dashed #425b4b;pointer-events:none;display:none}.corridor span{position:absolute;top:45%;width:100%;text-align:center;color:#6f897a;font-size:21px}footer{text-align:center;color:#98a69f;font-size:12px;height:38px;line-height:38px}.stage.browser .frame,.stage.browser iframe{width:min(1280px,calc(100vw - 32px));height:calc(100dvh - 142px)}.stage.browser .frame{transform:none!important}.stage.browser .corridor{display:none!important}@media(max-width:700px){header{padding:12px;flex-wrap:wrap;gap:12px}.controls{gap:8px;flex-wrap:wrap}h1 span{display:none}.stage{height:calc(100dvh - 145px)}.controls label{font-size:11px}.controls select{font-size:12px}footer{font-size:10px}a{font-size:12px}}
</style></head><body><header><h1>Hermy · Mirror preview<span>1080 × 1920 · Your reflection comes first</span></h1><div class="controls"><label>View <select id="view"><option value="mirror">Mirror</option><option value="browser">Companion</option></select></label><label>Moment <select id="scenario"><option value="live">Your live data</option><option value="day">Example: a full day</option><option value="agents">Example: six agents</option><option value="weekend">Example: quiet weekend</option><option value="soon">Example: starting soon</option><option value="leave">Example: time to leave</option><option value="talking">Example: Hermy talking</option><option value="sunset">Example: sunset soon</option><option value="quiet">Example: a quiet day</option><option value="stale">Example: delayed updates</option></select></label><label><input id="guide" type="checkbox"> Reflection guide</label><a href="/dashboard" target="_blank" rel="noopener">Open dashboard ↗</a></div></header><div class="stage" id="stage"><div class="frame" id="frame"><iframe id="mirror" title="Hermy dashboard preview" src="/dashboard?view=mirror&preview=1"></iframe><div class="corridor" id="corridor"><span>Your reflection<br>Clear space</span></div></div></div><footer id="caption">Live data · Preview stays visible while the physical mirror sleeps</footer><script>
const view=document.getElementById('view'),scenario=document.getElementById('scenario'),stage=document.getElementById('stage'),frame=document.getElementById('frame');
function fit(){if(view.value==='mirror'){const s=Math.min((stage.clientWidth-36)/1080,(stage.clientHeight-20)/1920);frame.style.transform=`scale(${s})`;}}
function update(){const q=new URLSearchParams({preview:'1'});if(view.value==='mirror')q.set('view','mirror');if(scenario.value!=='live')q.set('example',scenario.value);document.getElementById('mirror').src='/dashboard?'+q;stage.classList.toggle('browser',view.value==='browser');document.getElementById('caption').textContent=scenario.value==='live'?'Live data · Preview stays visible while the physical mirror sleeps':'Sample data · This example never changes your real calendar or reminders';fit();}
view.addEventListener('change',update);scenario.addEventListener('change',update);document.getElementById('guide').addEventListener('change',e=>{document.getElementById('corridor').style.display=e.target.checked?'block':'none';});addEventListener('resize',fit);const initial=new URLSearchParams(location.search);if([...scenario.options].some(o=>o.value===initial.get('example')))scenario.value=initial.get('example');update();
</script></body></html>
