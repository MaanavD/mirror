<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mirror — preview 1080×1920</title>
    <!--
      Laptop harness for iterating on the real dashboard: the live page inside a
      correctly-proportioned 1080x1920 frame, scaled to fit. Dev only — the
      kiosk points at / , never at /preview.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
        font: 12px/1.4 ui-monospace, 'DejaVu Sans Mono', Menlo, monospace;
        color: rgba(255, 255, 255, 0.3);
      }

      .wrap {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .frame {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: #000;
        transform-origin: center center;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16);
      }

      iframe {
        width: 1080px;
        height: 1920px;
        border: 0;
        display: block;
        background: #000;
      }

      .caption {
        position: fixed;
        left: 10px;
        bottom: 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .links {
        position: fixed;
        right: 10px;
        bottom: 8px;
        letter-spacing: 0.14em;
      }

      a {
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
        margin-left: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="frame" id="frame">
        <iframe src="/" title="mirror dashboard"></iframe>
      </div>
    </div>
    <div class="caption" id="caption">1080 × 1920</div>
    <div class="links">
      <a href="/mockups/editorial.html">mockup a · editorial</a>
      <a href="/mockups/instrument.html">mockup b · instrument</a>
      <a href="/healthz">healthz</a>
    </div>

    <script>
      (function () {
        var frame = document.getElementById('frame');
        var caption = document.getElementById('caption');
        function fit() {
          var s = Math.min((window.innerWidth - 40) / 1080, (window.innerHeight - 40) / 1920);
          frame.style.transform = 'scale(' + s + ')';
          caption.textContent = '1080 × 1920 · ' + Math.round(s * 100) + '%';
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
  </body>
</html>
