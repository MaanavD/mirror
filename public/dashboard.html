<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Mirror · Hermy</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 4h16v16H4zM8 12h8' fill='none' stroke='%239ce1db' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <!--
    1080×1920 behind two-way glass: black is mirror, light is screen.
    The corridor x 340–740 below the top band is where the reflection lives;
    nothing renders there. Top band = when + what matters; rails = detail;
    bottom band = ambient. See DESIGN.md.
  -->
  <main id="dashboard">
    <header class="top" aria-label="Time, weather and what matters now">
      <div class="when">
        <div class="clock"><span id="time">—:—</span><span id="period"></span></div>
        <div class="date-row"><p class="date" id="date"></p><div id="home"></div></div>
      </div>
      <div class="now-weather" id="now-weather"></div>
      <section class="headline" id="headline" aria-live="polite"></section>
    </header>

    <section class="rail left" aria-labelledby="stream-heading">
      <h2 class="rail-label" id="stream-heading">Rest of today</h2>
      <p class="all-day" id="all-day" hidden></p>
      <ol class="stream" id="stream"></ol>
      <p class="note" id="stream-note" hidden></p>
    </section>

    <aside class="rail right">
      <section class="block" id="weather-block" aria-label="Weather ahead"></section>
      <section class="block" id="focus-block" aria-labelledby="focus-heading">
        <h2 class="rail-label" id="focus-heading">Worth your time</h2>
        <div id="focus"></div>
      </section>
      <section class="block" id="ahead-block" aria-labelledby="ahead-heading">
        <h2 class="rail-label" id="ahead-heading">Coming up</h2>
        <div id="ahead"></div>
      </section>
    </aside>

    <footer class="bottom">
      <section class="agents" id="agents" aria-label="Agent activity" hidden></section>
      <section class="music" id="music" aria-label="Now playing" hidden></section>
      <div class="hermy" id="hermy">
        <div class="avatar" aria-hidden="true"><span class="hermy-sprite"></span><span class="signal-bars"><i></i><i></i><i></i><i></i></span></div>
        <div class="hermy-copy"><p id="hermy-note"></p><p id="quote-author"></p></div>
      </div>
    </footer>
    <span class="stale-dot" id="stale-dot" hidden></span>
  </main>
  <div class="example-bar" id="example-bar" hidden></div>
  <script type="module" src="/dashboard.js"></script>
</body></html>
