<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>hermy.exe</title>
    <!-- Inline favicon: silences the kiosk's one 404. Navi-emblem ring. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2367e8f9' stroke-width='1.5'/%3E%3Cpath d='M4 12 12 4' stroke='%2367e8f9' stroke-width='1.5'/%3E%3C/svg%3E" />
    <!-- BN pixel faces (design/BN_REFERENCE.md §5). The kiosk is online for its
         data modules anyway; offline this link fails silently and the local()
         sources / monospace stack in styles.css take over. No FOIT: swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Fixed 1080x1920 portrait. BN window grammar per design/BN_REFERENCE.md:
         notched line-work frames with header tabs, no filled panels.

         Composition is EDGE RAILS, because the mirror is the product. Measured
         off a photograph of the glass in use, the reflected head lands at about
         x 350..750, y 300..950 — a vertical column down the middle, not a
         horizontal band. So the clear zone is vertical too:

           CORRIDOR   x 340..740, y 280..1600 — black, frameless, content-free.
                      His face reflects here. Nothing persistent renders in it;
                      only transient overlays may cross it.
           LEFT RAIL  clock / date / astro, top-left. It may use the full width
                      of the glass because it all sits above the corridor.
           RIGHT RAIL weather over the agenda over the leave-by chip, a single
                      300px column pinned to the right edge (x 740..1040).
           BOTTOM     quote/nanoleaf lower-left, hermy over tasks lower-right,
                      news on the bottom edge — unchanged.

         The two exceptions that still span the full width are the PET header at
         the very top (y 16..72, above the corridor) and the news line at the
         very bottom. Every band clips its own overflow, so no module can grow
         into the corridor no matter what the payload says. -->
    <main id="root">
      <div class="top-band">
        <!-- PET header: Navi emblem + nameplate + net location. The breathing
             status square is the only always-on cyan element. -->
        <header class="pet-head">
          <div class="navi">
            <!-- Navi emblem: ring + core + the BN diagonal band, line-work only. -->
            <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true">
              <circle class="e-outer" cx="24" cy="24" r="21" />
              <circle class="e-inner" cx="24" cy="24" r="15" />
              <path class="e-band" d="M10.5 30 30 10.5M18 37.5 37.5 18" />
            </svg>
            <span class="navi-name">hermy.exe</span>
            <span class="status-dot"></span>
          </div>
          <div class="net">
            <span>seattle</span>
            <span class="sep">/</span>
            <span id="week"></span>
          </div>
        </header>

        <!-- The two rails, split by the corridor. Per the BN reference's
             composition note for 1080x1920, the side rail is where the mail and
             alert lists belong; here it carries the whole right-hand stack. -->
        <section class="deck">
          <!-- LEFT RAIL. Everything in it is above the corridor's top edge, so
               it keeps the width — and the position — it always had. -->
          <div class="masthead">
            <!-- Clock is client-side only: it renders before, and without, any
                 network. app.js splits it into per-character cells so a changed
                 digit can tick in place. -->
            <div id="clock" class="clock">--:--</div>
            <div class="dateline"><span id="date"></span></div>
            <!-- Sun up / sun down / UV: promoted out of the old dim one-liner
                 into a real readout with line-work glyphs. No moon data. -->
            <div class="slot astro" id="astro-line"></div>
          </div>

          <!-- RIGHT RAIL: one 300px column against the panel edge. -->
          <div class="rail">
            <div class="wx-deck" data-module="weather">
              <div class="slot wx" id="wx-today"></div>
              <div class="slot wx next" id="wx-tomorrow"></div>
              <!-- Both conditional tags share a row when they fit and wrap
                   onto two when they do not; neither is ever wide enough to
                   push the rail out of its column. -->
              <div class="wx-chips">
                <div class="slot wx-rain" id="wx-rain"></div>
                <div id="aqi-chip"></div>
              </div>
            </div>

            <!-- Agenda, under the weather. At rail width the old side-by-side
                 columns do not fit, so today stacks over tomorrow and the
                 second folder tab becomes a sub-head: same BN reading order,
                 a quarter of the footprint. A column hides when its day is
                 empty; the frame hides when both are. -->
            <section class="win days" data-module="calendar">
              <div class="frame"></div>
              <span class="tab"><span>days</span></span>
              <div class="cal-col">
                <span class="cal-head">today</span>
                <div class="slot cal" id="cal-today"></div>
              </div>
              <div class="cal-col aux">
                <span class="cal-head">tomorrow</span>
                <div class="slot cal" id="cal-tomorrow"></div>
              </div>
            </section>

            <!-- Leave-by chip: dim line under the agenda frame, only visible
                 when a leave-by time exists and is in the future. -->
            <div class="leaveby" id="leaveby" data-module="leaveby"></div>
          </div>
        </section>
      </div>

      <!-- Below the rails: guaranteed black, frameless glass all the way across
           until the bottom band starts at y=1472. Nothing renders in here. -->
      <div class="face" aria-hidden="true"></div>

      <!-- Mount points: the vinyl is a stateful low-center overlay, not a grid
           module; the empty mount collapses back to pure black. -->
      <div id="now-playing" class="mount" aria-live="polite"></div>
      <div id="hermy-dialogue" class="mount"></div>

      <div class="bottom-band">
        <!-- Bottom band: the Nanoleaf chip readout sits directly above the
             quote at lower-left; the task frame supplies the shared top edge. -->
        <div class="band">
          <div class="band-left">
            <section class="nanoleaf" id="nanoleaf" data-module="nanoleaf">
              <div class="body"></div>
            </section>

            <section class="quote" id="quote" data-module="quote">
              <div class="body"></div>
              <!-- Required by the ZenQuotes terms. Deliberately near-invisible. -->
              <div class="credit">inspired by ZenQuotes</div>
            </section>
          </div>

          <div class="band-right">
            <!-- Hermy.EXE idle avatar: 12-frame hand-built sprite sheet, sitting
                 directly on the top edge of the tasks frame. -->
            <div id="hermy" class="hermy" aria-hidden="true"></div>
            <section class="win tasks" id="notion" data-module="notion">
              <div class="frame"></div>
              <span class="tab"><span>tasks</span></span>
              <div class="body"></div>
            </section>
          </div>
        </div>

        <!-- Net feed: a single dim BN line below the quote, one HN headline at a
             time. Collapses to pure black on failure (no data -> no frame). -->
        <div class="news" id="news" data-module="news">
          <div class="body"></div>
        </div>
      </div>

      <!-- The only staleness signal anywhere: one dim dot. Never text. -->
      <div id="dot" class="dot"></div>
    </main>

    <!-- One-shot boot / "JACK IN" overlay (see app.js bootAnimation). Pure
         black, line-work only; removed from the DOM when it finishes and
         skipped entirely under prefers-reduced-motion. The window frames draw
         themselves in right after it clears. -->
    <div id="boot" aria-hidden="true">
      <div class="boot-text" role="img" aria-label="JACK IN! HERMY.EXE"></div>
      <div class="boot-sweep"></div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
