<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>hermy.exe</title>
    <!-- BN pixel faces (design/BN_REFERENCE.md §5). The kiosk is online for its
         data modules anyway; offline this link fails silently and the local()
         sources / monospace stack in styles.css take over. No FOIT: swap. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Fixed 1080x1920 portrait. BN window grammar per design/BN_REFERENCE.md:
         notched line-work frames with header tabs, no filled panels. The tall
         `.void` row keeps the centre of the glass empty for the viewer. -->
    <main id="root">
      <!-- PET header: Navi emblem + nameplate + net location. The breathing
           status square is the only always-on cyan element. -->
      <header class="pet-head">
        <div class="navi">
          <!-- Navi emblem: ring + core + the BN diagonal band, line-work only. -->
          <svg class="emblem" viewBox="0 0 48 48" aria-hidden="true">
            <circle class="e-outer" cx="24" cy="24" r="21" />
            <circle class="e-inner" cx="24" cy="24" r="15" />
            <path class="e-band" d="M10.5 30 30 10.5M18 37.5 37.5 18" />
          </svg>
          <span class="navi-name">hermy.exe</span>
          <span class="status-dot"></span>
        </div>
        <div class="net">
          <span>seattle</span>
          <span class="sep">/</span>
          <span id="week"></span>
        </div>
      </header>

      <section class="masthead">
        <!-- Clock is client-side only: it renders before, and without, any network. -->
        <div id="clock" class="clock">--:--</div>
        <div class="dateline"><span id="date"></span></div>
      </section>

      <!-- Combined day deck: each column is one BN window frame whose tab sits
           on the frame edge — weather summary on top, agenda under it.
           A whole column hides itself while both slots are empty. -->
      <section class="days">
        <section class="win day" id="day-today" data-module="weather calendar">
          <div class="frame"></div>
          <span class="tab"><span>today</span></span>
          <span class="tab aux"><span>weather</span></span>
          <div class="slot wx" id="wx-today"></div>
          <div class="slot cal" id="cal-today"></div>
        </section>

        <section class="win day" id="day-tomorrow" data-module="weather calendar">
          <div class="frame"></div>
          <span class="tab"><span>tomorrow</span></span>
          <div class="slot wx" id="wx-tomorrow"></div>
          <div class="slot cal" id="cal-tomorrow"></div>
        </section>
      </section>

      <div class="void"></div>

      <!-- Mount point: vinyl / now-playing overlay lands here later.
           Empty containers collapse to nothing (see .mount:empty). -->
      <div id="now-playing" class="mount"></div>

      <div class="lower">
        <section class="win tasks" id="notion" data-module="notion">
          <div class="frame"></div>
          <span class="tab"><span>tasks</span></span>
          <div class="body"></div>
        </section>
      </div>

      <!-- Mount point: Hermy's dialogue / message box lands here later. -->
      <div id="hermy-dialogue" class="mount"></div>

      <section class="quote" id="quote" data-module="quote">
        <div class="body"></div>
        <!-- Required by the ZenQuotes terms. Deliberately near-invisible. -->
        <div class="credit">inspired by ZenQuotes</div>
      </section>

      <!-- The only staleness signal anywhere: one dim dot. Never text. -->
      <div id="dot" class="dot"></div>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
